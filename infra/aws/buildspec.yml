version: 0.2

env:
  shell: bash

phases:
  pre_build:
    commands:
      - set -euo pipefail
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - STACK_OUTPUTS="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs' --output json)"
      - FRONTEND_URL="$(printf '%s' "$STACK_OUTPUTS" | jq -r '.[] | select(.OutputKey=="CloudFrontUrl") | .OutputValue')"
      - USER_POOL_ID="$(printf '%s' "$STACK_OUTPUTS" | jq -r '.[] | select(.OutputKey=="CognitoUserPoolId") | .OutputValue')"
      - USER_POOL_CLIENT_ID="$(printf '%s' "$STACK_OUTPUTS" | jq -r '.[] | select(.OutputKey=="CognitoUserPoolClientId") | .OutputValue')"
      - COGNITO_DOMAIN="$(printf '%s' "$STACK_OUTPUTS" | jq -r '.[] | select(.OutputKey=="CognitoDomain") | .OutputValue')"
      - test -n "$FRONTEND_URL" && test "$FRONTEND_URL" != "null"
      - test -n "$USER_POOL_ID" && test "$USER_POOL_ID" != "null"
  build:
    commands:
      - set -euo pipefail
      - docker build --pull --file backend/server/Dockerfile --tag "$BACKEND_REPOSITORY_URI:$BACKEND_IMAGE_TAG" .
      - >-
        docker build --pull
        --file "front end/Dockerfile"
        --build-arg "NEXT_PUBLIC_API_BASE_URL=$FRONTEND_URL/api"
        --build-arg "NEXT_PUBLIC_COGNITO_REGION=$AWS_DEFAULT_REGION"
        --build-arg "NEXT_PUBLIC_COGNITO_USER_POOL_ID=$USER_POOL_ID"
        --build-arg "NEXT_PUBLIC_COGNITO_CLIENT_ID=$USER_POOL_CLIENT_ID"
        --build-arg "NEXT_PUBLIC_COGNITO_DOMAIN=$COGNITO_DOMAIN"
        --build-arg "NEXT_PUBLIC_COGNITO_REDIRECT_URI=$FRONTEND_URL/login"
        --build-arg "NEXT_PUBLIC_COGNITO_LOGOUT_URI=$FRONTEND_URL/"
        --build-arg "NEXT_PUBLIC_COGNITO_OAUTH_SCOPES=openid email profile"
        --build-arg "NEXT_PUBLIC_COGNITO_SOCIAL_PROVIDERS=${COGNITO_SOCIAL_PROVIDERS:-}"
        --tag "$FRONTEND_REPOSITORY_URI:$FRONTEND_IMAGE_TAG"
        "front end"
  post_build:
    commands:
      - set -euo pipefail
      - docker push "$BACKEND_REPOSITORY_URI:$BACKEND_IMAGE_TAG"
      - docker push "$FRONTEND_REPOSITORY_URI:$FRONTEND_IMAGE_TAG"
      - printf '{"backend":"%s","frontend":"%s"}\n' "$BACKEND_REPOSITORY_URI:$BACKEND_IMAGE_TAG" "$FRONTEND_REPOSITORY_URI:$FRONTEND_IMAGE_TAG"
