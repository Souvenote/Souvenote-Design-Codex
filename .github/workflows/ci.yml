name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  frontend:
    name: Frontend baseline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front end
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: front end/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Generate Next.js types
        run: npm exec -- next typegen

      - name: Type-check
        run: npm exec -- tsc --noEmit --incremental false

      - name: Build production frontend
        run: npm run build

      - name: Block critical production dependency advisories
        run: npm audit --omit=dev --audit-level=critical

  backend:
    name: Backend baseline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: backend/server/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Type-check
        run: npm exec -- tsc --noEmit --incremental false

      - name: Run unit tests
        run: npm test -- --runInBand --no-cache

      - name: Build production backend
        run: npm run build

      - name: Block critical production dependency advisories
        run: npm audit --omit=dev --audit-level=critical
