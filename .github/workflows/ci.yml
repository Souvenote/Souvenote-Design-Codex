name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Workspace quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the repository npm version
        run: npm install --global npm@10.9.8

      - name: Install the exact workspace graph
        run: npm ci

      - name: Verify formatting, code, tests, builds, and production dependencies
        run: npm run verify

  local-stack:
    name: Credential-free local stack
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the repository npm version
        run: npm install --global npm@10.9.8

      - name: Install the exact workspace graph
        run: npm ci

      - name: Pull the pinned local PostgreSQL image
        run: docker pull postgres:16-alpine

      - name: Verify migrations, ownership, idempotency, and API security against PostgreSQL
        run: npm run test:database

      - name: Validate the Docker Compose definition
        run: docker compose --project-name souvenote-local --file compose.yaml config --quiet

      - name: Start, verify, and stop the local stack
        run: npm run smoke:stack

      - name: Preserve PostgreSQL data during cleanup
        if: always()
        run: npm run dev:down
